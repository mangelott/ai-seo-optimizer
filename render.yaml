databases:
  - name: ai-seo-optimizer-db
    databaseName: ai_seo_optimizer
    plan: free

services:
  - type: redis
    name: ai-seo-optimizer-redis
    plan: free
    ipAllowList: []

  - type: web
    name: ai-seo-optimizer-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run migrate
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-seo-optimizer-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-seo-optimizer-redis
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_AGENCY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GSC_REDIRECT_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: WP_CREDENTIALS_ENCRYPTION_KEY
        generateValue: true
    # Render's free tier doesn't offer a Background Worker service type, so
    # the audit worker (jobs/auditWorker.js) runs in-process inside server.js
    # instead of as a separate service. Move it back out to its own `worker`
    # service here if/when the plan is upgraded and the extra isolation is
    # worth it.
